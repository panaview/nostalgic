baseURL = 'https://panaview.github.io/nostalgic'
languageCode = 'en-us'
title = 'Nostalgic'

# This defines how dates are formatted
defaultContentLanguage = "en-gb"

[module]
  [[module.imports]]
    path = 'github.com/sergeyklay/gohugo-theme-ed'

[params]
  description = 'Welcome'
  name = 'Stew'
  email = 'mountainousjourney@gmail.com'
  footer = 'Built with <a href="https://github.com/sergeyklay/gohugo-theme-ed" target="_blank" rel="noopener noreferrer">Ed</a>. Distributed under an MIT license.'
  tagline = "for an era of craft long gone"
  [params.comments]
    enable = false

# For more see https://gohugo.io/content-management/menus/
[menus]
  [[menus.main]]        # sections in the website sidebar
    identifier = 'home' # menu item id
    name = 'Home'       # menu item display title
    pageRef = '/'       # path to the page
    weight = 1          # order of the menu item
  [[menus.main]]        # sections in the website sidebar
    identifier = 'repository' # menu item id
    name = 'Repository'       # menu item display title
    url = 'https://github.com/panaview/nostalgic/tree/master'       # path to the page
    weight = 2          # order of the menu item
 
