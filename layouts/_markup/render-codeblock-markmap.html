<pre class="markmap">
  {{ .Inner | htmlEscape | safeHTML }}
</pre>

<style>
	.markmap {
		position: relative;
	}
	.markmap > svg {
		width: 100%;
		height: 300px;
	}
</style>

<script>
  window.markmap = {
    /** @type AutoLoaderOptions */
		autoLoader: {
      toolbar: false, // Disable toolbar
      manual: false, // Load markmap
		},
    
	};
</script>

<!-- Load markmap from CDN -->
<script src="https://cdn.jsdelivr.net/npm/markmap-autoloader@latest"></script>
